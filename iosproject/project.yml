name: JournalCollage
options:
  bundleIdPrefix: com.journalcollage
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
targets:
  JournalCollage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JournalCollage
        excludes:
          - Resources/**
    resources:
      - path: JournalCollage/Resources
    info:
      path: JournalCollage/Support/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        INFOPLIST_FILE: JournalCollage/Support/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.journalcollage.app.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.journalcollage.app
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    scheme:
      testTargets:
        - JournalCollageTests
      gatherCoverageData: true
      commandLineArguments:
        "-JournalCollageDebugChrome": true
  JournalCollageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JournalCollageTests
    dependencies:
      - target: JournalCollage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.journalcollage.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JournalCollage.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/JournalCollage"
        BUNDLE_LOADER: "$(TEST_HOST)"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
