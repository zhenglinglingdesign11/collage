server {
    listen 80;
    server_name api.mixmade.xyz;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.mixmade.xyz;

    ssl_certificate /etc/nginx/ssl/api.mixmade.xyz-rsa/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.mixmade.xyz-rsa/key.pem;

    client_max_body_size 10M;

    location /remove-bg {
        limit_req zone=rembg_ip_rate burst=3 nodelay;
        limit_conn rembg_ip_conn 2;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8000/remove-bg;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
